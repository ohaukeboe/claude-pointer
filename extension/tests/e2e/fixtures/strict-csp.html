<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; frame-src 'none'; child-src 'none'; script-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strict CSP</title>
  </head>
  <body>
    <p id="target">A page that allows no frames at all.</p>
  </body>
</html>
